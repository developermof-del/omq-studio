name: Publish OMQ studio
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omq-pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Restore the approved release on the first publication only
        shell: python
        run: |
          import pathlib, hashlib, concurrent.futures, urllib.request, time, subprocess
          root=pathlib.Path('site')
          if (root/'index.html').exists(): raise SystemExit(0)
          files='index.html collection.html download.html platforms.html brand.html'.split()
          files += ['assets/'+n+ext for n in 'brand collection common download home platforms'.split() for ext in ['.css','.js']]
          files += ['assets/'+s for s in 'kit-index.js site-config.js logo-black.svg logo-white.svg logo-primary.svg logo-reverse.svg motion.mp4 favicon.png'.split()]
          files += ['assets/downloads/'+s for s in 'brand-guide.pdf social-guide.pdf motion-kit.zip'.split()]
          files += [f'assets/downloads/{s}-{i:02}.bin' for s in ['social','identity'] for i in range(1,8)]
          files += ['assets/fonts/'+s for s in 'FONT_SOURCES.txt OFL-Arabic.txt OFL-Mono.txt OFL-Sans.txt IBMPlexMono-Regular.woff IBMPlexSans-Regular.woff IBMPlexSansArabic-Bold.woff IBMPlexSansArabic-Medium.woff IBMPlexSansArabic-Regular.woff IBMPlexSansArabic-SemiBold.woff'.split()]
          files += ['assets/images/'+s+'.webp' for s in 'brand-motion-poster clay detail hero label packaging salla scale scene social workshop'.split()]
          files += [f'assets/social/{t}-{s}.webp' for t in ['profiles','content'] for s in 'behance facebook instagram linkedin pinterest snapchat telegram threads tiktok whatsapp x youtube'.split()]
          assert len(set(files))==len(files)==87
          def retrieve(name):
              url='https://omq-form-studies.surprisingherb1.chatgpt.site/'+name
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'OMQ-Studio-Release/1','Accept-Encoding':'identity'})
                      with urllib.request.urlopen(req,timeout=45) as resp:
                          if not resp.geturl().startswith('https://omq-form-studies.surprisingherb1.chatgpt.site/'): raise ValueError('Unexpected source')
                          data=resp.read(12*1024*1024+1)
                      if len(data)>12*1024*1024: raise ValueError('Unexpected size')
                      p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
                      return name,hashlib.sha256(data).hexdigest()
                  except Exception as ex:
                      if attempt==2: raise RuntimeError(f'{name}: {ex}') from ex
                      time.sleep(2**attempt)
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool: results=sorted(pool.map(retrieve,files))
          def fingerprint(pairs):return hashlib.sha256(''.join(n+' '+v+'\n' for n,v in pairs).encode()).hexdigest()
          for n,v in results: print(n,v)
          if fingerprint(results)!='2d7b7cf57cd489463b2a74e6a5b4f5e96041105eafe095133c397b4580825ee8':raise RuntimeError('Files differ from the approved release: '+fingerprint(results))
          (root/'.nojekyll').touch()
          subprocess.run(['git','add','--','site'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Publish the complete verified OMQ studio website and design assets'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/main'],check=True)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
