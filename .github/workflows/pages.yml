name: Publish OMQ studio
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml', 'scripts/check.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omq-pages
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check internal links and original download archives
        run: python3 scripts/check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
